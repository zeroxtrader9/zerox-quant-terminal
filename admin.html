<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROX AI - OWNER CONTROL PANEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0e14; color: #fff; padding: 30px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #232d3f; padding-bottom: 15px; margin-bottom: 25px; }
        h1 { font-size: 22px; color: #00e5ff; letter-spacing: 1px; }
        
        .creator-box {
            background: #151a23;
            border: 1px solid #232d3f;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .custom-input {
            flex: 1;
            padding: 12px 16px;
            background: #1c2331;
            border: 1px solid #2d3748;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            outline: none;
        }
        .custom-input:focus { border-color: #00e5ff; }

        .btn-gen { background: linear-gradient(135deg, #00e5ff, #0077ff); color: #000; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .btn-gen:hover { opacity: 0.9; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: #151a23; padding: 20px; border-radius: 10px; border: 1px solid #232d3f; }
        .stat-label { font-size: 11px; color: #a0aec0; letter-spacing: 0.5px; }
        .stat-val { font-size: 28px; font-weight: 800; color: #00e5ff; margin-top: 5px; }

        .panel-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
        .box { background: #151a23; border: 1px solid #232d3f; border-radius: 12px; padding: 20px; }
        .box h3 { font-size: 15px; margin-bottom: 15px; color: #a0aec0; border-bottom: 1px solid #232d3f; padding-bottom: 8px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th, td { padding: 12px 8px; border-bottom: 1px solid #1f2737; }
        th { color: #718096; font-size: 11px; }
        .key-text { color: #00e5ff; font-weight: bold; font-family: monospace; font-size: 14px; }
        
        .badge-locked { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-available { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        .btn-del { background: #ff4757; color: #fff; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }
        .btn-reset { background: #f39c12; color: #000; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; margin-right: 4px; }
        .copy-btn { background: #232d3f; color: #00e5ff; border: 1px solid #00e5ff; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-left: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>ZEROX AI // OWNER CONTROL PANEL</h1>
    </div>

    <!-- Manual Key Creator Section -->
    <div class="creator-box">
        <input type="text" id="manualKeyInput" class="custom-input" placeholder="Type VIP Key (e.g. VIP-USER-RAHUL, ZEROX-101)">
        <button class="btn-gen" onclick="addCustomKey()">+ CREATE 1-USER KEY</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">TOTAL ACTIVE KEYS</div>
            <div class="stat-val" id="totalKeysCount">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">TOTAL USER LOGINS</div>
            <div class="stat-val" id="totalLoginsCount">0</div>
        </div>
    </div>

    <div class="panel-grid">
        <!-- Active Keys List -->
        <div class="box">
            <h3>ACTIVE 1-DEVICE VIP LICENSE KEYS</h3>
            <table>
                <thead>
                    <tr>
                        <th>LICENSE KEY</th>
                        <th>DEVICE LOCK STATUS</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="keysTableBody"></tbody>
            </table>
        </div>

        <!-- Live Login History Logs -->
        <div class="box">
            <h3>LIVE USER LOGIN HISTORY</h3>
            <table>
                <thead>
                    <tr>
                        <th>KEY USED</th>
                        <th>LOGIN TIME</th>
                    </tr>
                </thead>
                <tbody id="logsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function getKeys() {
            const keys = localStorage.getItem('zerox_active_keys');
            return keys ? JSON.parse(keys) : [];
        }

        function getLogs() {
            const logs = localStorage.getItem('zerox_login_logs');
            return logs ? JSON.parse(logs) : [];
        }

        function renderAdminDashboard() {
            const keys = getKeys();
            const logs = getLogs();

            document.getElementById('totalKeysCount').textContent = keys.length;
            document.getElementById('totalLoginsCount').textContent = logs.length;

            const keysBody = document.getElementById('keysTableBody');
            if (keys.length === 0) {
                keysBody.innerHTML = '<tr><td colspan="3" style="color:#718096; text-align:center; padding:15px;">No active keys. Create one above.</td></tr>';
            } else {
                keysBody.innerHTML = keys.map(k => `
                    <tr>
                        <td>
                            <span class="key-text">${k.key}</span>
                            <button class="copy-btn" onclick="copyKey('${k.key}')">Copy</button>
                        </td>
                        <td>
                            ${k.lockedDeviceId 
                                ? `<span class="badge-locked">LOCKED TO 1 USER</span><br><small style="color:#718096; font-size:10px;">ID: ${k.lockedDeviceId.substring(0, 10)}...</small>` 
                                : '<span class="badge-available">AVAILABLE (NOT USED YET)</span>'}
                        </td>
                        <td>
                            ${k.lockedDeviceId ? `<button class="btn-reset" onclick="unlockDevice('${k.key}')" title="Reset Device">RESET</button>` : ''}
                            <button class="btn-del" onclick="deleteKey('${k.key}')">DELETE</button>
                        </td>
                    </tr>
                `).join('');
            }

            const logsBody = document.getElementById('logsTableBody');
            if (logs.length === 0) {
                logsBody.innerHTML = '<tr><td colspan="2" style="color:#718096; text-align:center; padding:15px;">No logins recorded yet</td></tr>';
            } else {
                logsBody.innerHTML = logs.map(l => `
                    <tr>
                        <td class="key-text">${l.licenseKey}</td>
                        <td style="color:#2ed573; font-family:monospace;">${l.loginTime}</td>
                    </tr>
                `).join('');
            }
        }

        function addCustomKey() {
            const input = document.getElementById('manualKeyInput');
            const keyName = input.value.trim().toUpperCase();

            if (!keyName) {
                alert('Pehle Key ka naam likhiye!');
                return;
            }

            let keys = getKeys();
            if (keys.some(k => k.key === keyName)) {
                alert('Yeh Key pehle se bani hui hai!');
                return;
            }

            const newEntry = {
                key: keyName,
                createdAt: new Date().toLocaleString(),
                lockedDeviceId: null, // Null means kisi device par lock nahi hai abhi
                status: 'ACTIVE'
            };

            keys.push(newEntry);
            localStorage.setItem('zerox_active_keys', JSON.stringify(keys));
            
            input.value = '';
            renderAdminDashboard();
            alert(`✅ 1-User VIP Key Created:\n\n${keyName}\n\nJab user isse login karega, ye uske browser par permanently lock ho jayegi.`);
        }

        function unlockDevice(keyToUnlock) {
            if (confirm(`Kya aap ${keyToUnlock} se device lock hatana chahte hain? Naya banda ise use kar sakega.`)) {
                let keys = getKeys();
                const target = keys.find(k => k.key === keyToUnlock);
                if (target) {
                    target.lockedDeviceId = null;
                    localStorage.setItem('zerox_active_keys', JSON.stringify(keys));
                    renderAdminDashboard();
                }
            }
        }

        function deleteKey(keyToDelete) {
            if (confirm(`Kya aap ${keyToDelete} ko delete karna chahte hain?`)) {
                let keys = getKeys();
                keys = keys.filter(k => k.key !== keyToDelete);
                localStorage.setItem('zerox_active_keys', JSON.stringify(keys));
                renderAdminDashboard();
            }
        }

        function copyKey(keyText) {
            navigator.clipboard.writeText(keyText);
            alert('Key Copied: ' + keyText);
        }

        setInterval(renderAdminDashboard, 2000);
        renderAdminDashboard();
    </script>
</body>
</html>
