<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEROX QUANT AI | TERMINAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VIP 30-DAY LOCK POPUP -->
    <div id="vipLockOverlay">
        <div class="lock-box">
            <h2>VIP ACCESS REQUIRED</h2>
            <p>Enter your 30-Day VIP Key to continue</p>
            <input type="text" id="licenseKeyInput" placeholder="ENTER VIP KEY">
            <button onclick="attemptLogin()">UNLOCK TERMINAL</button>
            <div id="loginErrorMsg" class="error-msg">INVALID KEY</div>
        </div>
    </div>

    <!-- MAIN TERMINAL UI -->
    <div class="terminal-grid">
        <div class="panel">
            <div class="header-box">
                <div class="title">ZEROX QUANT ENGINE</div>
                <div id="vipStatus" class="status-badge">VIP CHECKING...</div>
            </div>

            <!-- PROBABILITY HUD CARD -->
            <div class="signal-card" id="signalCardBox">
                <div class="prob-display">
                    <div class="prob-box">
                        <span class="prob-label call-text">CALL (BUY)</span>
                        <span class="prob-val call-text" id="callProb">00.00%</span>
                    </div>
                    <div class="prob-box">
                        <span class="prob-label put-text">PUT (SELL)</span>
                        <span class="prob-val put-text" id="putProb">00.00%</span>
                    </div>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="probBar"></div>
                </div>

                <div class="bias-text" id="biasStatus">BIAS: ANALYZING...</div>
            </div>

            <div class="info-note">Live Zeiierman Breakout Logic Active</div>
        </div>

        <!-- TRADINGVIEW LIVE CHART -->
        <div class="chart-panel">
            <iframe id="tv_frame" src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=1&theme=dark&style=1&timezone=Etc%2FUTC"></iframe>
        </div>
    </div>

    <script src="quant.js"></script>
</body>
</html>
