<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZEROX AI | QUANT TERMINAL PRO ULTRA</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body>

    <!-- WELCOME BOOT SCREEN -->
    <div id="welcomeScreen">
        <div class="welcome-box">
            <div class="welcome-logo">ZEROX QUANT AI</div>
            <div class="welcome-subtitle">SYSTEM INITIALIZATION // NEURAL FEED</div>
            <div class="welcome-loader-bar">
                <div class="welcome-loader-fill" id="welcomeProgress"></div>
            </div>
            <div class="welcome-status" id="welcomeStatusText">CONNECTING TO QUANT NODES...</div>
        </div>
    </div>

    <!-- VIP EXPIRED LOCK MODAL -->
    <div id="vipLockOverlay">
        <div class="lock-box">
            <h2>VIP KEY REQUIRED</h2>
            <p>Access expired. Enter 30-Day VIP Key to continue.</p>
            <input type="text" id="licenseKeyInput" class="key-input" placeholder="ENTER VIP KEY" autofocus>
            <button onclick="attemptLogin()" class="btn-unlock">UNLOCK VIP TERMINAL</button>
            <a href="https://t.me/zeroxwithai" target="_blank" class="btn-tg-lock">GET VIP KEY ON @ZEROXWITHAI</a>
            <div id="loginErrorMsg" class="login-error"></div>
        </div>
    </div>

    <!-- TOP COMPACT BAR: ASSET + TIMEFRAME + EXPIRY STATUS -->
    <div class="top-control-bar">
        <select id="assetSelector" onchange="switchMarket()">
            <optgroup label="FOREX">
                <option value="FX:EURUSD">EUR/USD</option>
                <option value="FX:GBPUSD">GBP/USD</option>
                <option value="FX:USDJPY">USD/JPY</option>
            </optgroup>
            <optgroup label="CRYPTO">
                <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                <option value="BINANCE:ETHUSDT">ETH/USDT</option>
            </optgroup>
            <optgroup label="COMMODITIES">
                <option value="OANDA:XAUUSD">GOLD</option>
            </optgroup>
        </select>

        <div class="tf-mini-bar">
            <button class="tf-btn active" onclick="setTimeframe(1, this)">1M</button>
            <button class="tf-btn" onclick="setTimeframe(5, this)">5M</button>
            <button class="tf-btn" onclick="setTimeframe(15, this)">15M</button>
        </div>

        <div class="status-badge" id="activeKeyStatus">DEMO: 25M</div>
    </div>

    <!-- MAIN SIGNAL HUD (TOP PAR - ZERO SCROLL) -->
    <div class="signal-hud-card pulse-call" id="signalCardBox">
        <div class="hud-col left">
            <div class="hud-label">QUANT SIGNAL</div>
            <div class="hud-signal call" id="signalText">CALL (BUY)</div>
        </div>

        <div class="hud-col middle">
            <div class="hud-label">CANDLE TIMER</div>
            <div class="hud-timer" id="candleTimerDisplay">--:--</div>
        </div>

        <div class="hud-col right">
            <div class="hud-sub">CONF: <span id="accuracyText">94.6%</span></div>
            <div class="hud-sub">TREND: <span id="trendText" style="color:var(--call);">BULL</span></div>
            <div class="hud-sub">DEMO: <span id="timerDisplay" style="color:#ff3366;">25:00</span></div>
        </div>
    </div>

    <!-- TRADINGVIEW LIVE CHART (FULL SCREEN FIT) -->
    <div class="chart-container-wrap">
        <iframe id="tv_frame" src="https://s.tradingview.com/widgetembed/?symbol=FX:EURUSD&interval=1&theme=dark&style=1&timezone=Etc%2FUTC&hideideas=1"></iframe>
    </div>

    <!-- SCRIPTS -->
    <script src="chart.js"></script>
    <script src="quant.js"></script>
    <script src="timer.js"></script>
</body>
</html>
